`;

  const $ = id => root.getElementById(id);
  const all = selector => root.querySelectorAll(selector);
  const storageKey = "duragrip-seat-cover-design";

  const defaultLogo = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90">
  <g fill="#fff">
    <path fill-rule="evenodd"
      d="M8 10H76L90 24V44L78 54L96 80H71L53 56H28V80H8ZM28 27V40H67L70 37V30L67 27Z"/>
    <path d="M150 5L200 80H100Z"/>
    <path fill-rule="evenodd"
      d="M210 10H270L292 30V60L270 80H210ZM230 28V62H262L272 52V38L262 28Z"/>
  </g>
</svg>`;

  const defaults = {
    left: "#e62e2e",
    right: "#e62e2e",
    top: "#20201d",
    ribsColour: "#ffffff",
    trim: "#ffffff",
    first: "PERCY",
    last: "",
    number: "696",
    text: "#ffffff",
    ribs: 5,
    texture: true,
    textureTop: true,
    textureSides: false,
    badge: true,
    make: "",
    model: "",
    year: "",
    notes: "",
    logo: "data:image/svg+xml;base64," + btoa(defaultLogo)
  };

  let state = { ...defaults };

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (saved && typeof saved === "object") state = { ...defaults, ...saved };
  } catch {}

  state.ribs = Math.max(0, Math.min(5, Number(state.ribs) || 0));

  let selected = "left";
  let toastTimer;
  let emailFile = null;
  let emailDetails = null;

  const parts = [
    ["left", "Left side"],
    ["top", "Top panel"],
    ["right", "Right side"],
    ["ribsColour", "Ribs"]
  ];

  const colours = [
    ["#79b52b", "Kawasaki green", "Green"],
    ["#20201d", "Carbon black", "Black"],
    ["#ffffff", "White", "White"],
    ["#e62e2e", "Race red", "Red"],
    ["#f46826", "KTM orange", "Orange"],
    ["#1675dc", "Yamaha blue", "Blue"],
    ["#f6ce2b", "Suzuki yellow", "Yellow"],
    ["#8c44b7", "Purple", "Purple"],
    ["#c1ee42", "Neon lime", "Neon Lime"],
    ["#164e3c", "Forest green", "Dark Green"],
    ["#a6afb4", "Cool grey", "Grey"],
    ["#283764", "Midnight blue", "Dark Blue"],
    ["#f38ab6", "Pink", "Pink"],
    ["#17b9b4", "Turquoise", "Turquoise"],
    ["#b2a28a", "Sand", "Sand"],
    ["#6e293c", "Burgundy", "Burgundy"]
  ];

  const clothPaths = {
    left: "M448 12 L315 39 L309 49 L302 41 L294 43 Q283 54 270 84 L29 636 Q-12 752 3 866 L224 1929 Q236 1966 292 1998 Q359 2031 397 2035 L404 2033 Q377 1010 448 12Z",
    right: "M742 12 L875 39 L881 49 L888 41 L896 43 Q907 54 920 84 L1161 636 Q1202 752 1187 866 L966 1929 Q954 1966 898 1998 Q831 2031 793 2035 L786 2033 Q813 1010 742 12Z",
    top: "M496 12 Q555 1 591 0 L596 7 L601 0 Q638 1 696 12 Q782 937 750 2032 Q653 2048 596 2048 Q538 2048 445 2032 Q405 1000 496 12Z"
  };

  const esc = value => String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&apos;"
  }[character]));

  function panelBounds(y) {
    function point(a, b, c, t) {
      return (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
    }

    function edge(xs, ys) {
      let lo = 0;
      let hi = 1;

      for (let i = 0; i < 40; i++) {
        const t = (lo + hi) / 2;
        if (point(...ys, t) < y) lo = t;
        else hi = t;
      }

      return point(...xs, (lo + hi) / 2);
    }

    const left = edge([496, 405, 445], [12, 1000, 2032]);
    const right = edge([696, 782, 750], [12, 937, 2032]);

    return { left, right, center: (left + right) / 2, width: right - left };
  }

  function riderLine(value, y, size, width, spacing = 1) {
    if (!value) return "";
    const panel = panelBounds(y - size * .35);

    return `<text x="${panel.center}" y="${y}" font-size="${size}"
      letter-spacing="${spacing}"
      textLength="${Math.min(width, panel.width * .86)}"
      lengthAdjust="spacingAndGlyphs">${esc(value)}</text>`;
  }

  function logoMarkup() {
    if (!state.logo) return "";
    const panel = panelBounds(1745);
    const width = panel.width * .9;

    return `<image x="${panel.center - width / 2}" y="1540"
      width="${width}" height="410" preserveAspectRatio="xMidYMid meet"
      href="${esc(state.logo)}"/>`;
  }

  function texturePattern(key) {
    const hex = state[key];
    const rgb = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    const dark = rgb[0] * .2126 + rgb[1] * .7152 + rgb[2] * .0722 < 135;

    return `<pattern id="grip-${key}" width="14" height="14"
      patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.7"
        fill="${dark ? "#d1d5d0" : "#20251e"}"
        opacity="${dark ? ".32" : ".23"}"/>
      <circle cx="4" cy="5" r="1.2"
        fill="${dark ? "#ffffff" : "#000000"}" opacity=".12"/>
    </pattern>`;
  }

  function textureOverlay() {
    if (!state.texture) return "";

    const panels = [
      ...(state.textureTop ? ["top"] : []),
      ...(state.textureSides ? ["left", "right"] : [])
    ];

    return panels.map(key => `<path fill="url(#grip-${key})"
      pointer-events="none" d="${clothPaths[key]}"/>`).join("");
  }

  function svg() {
    const panels = ["left", "right", "top"].map(key =>
      `<path data-part="${key}" fill="${state[key]}" d="${clothPaths[key]}"/>`
    ).join("");

    const rider = state.badge
      ? riderLine(state.first, 254, 30, Math.max(130, state.first.length * 18), 2)
        + riderLine(state.last, 292, 30, Math.max(115, state.last.length * 18), 2)
        + riderLine(state.number, 407, 132, Math.max(90, state.number.length * 83), 0)
      : "";

    const ribs = Array.from({ length: Number(state.ribs) }, (_, i) => {
      const y = 784 + i * (state.ribs > 1 ? 670 / (state.ribs - 1) : 0);
      return `<rect x="489" y="${y}" width="214" height="53" rx="11"/>`;
    }).join("");

    return `<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1190 2048" aria-label="Custom seat cover design">
      <defs>${["top", "left", "right"].map(texturePattern).join("")}</defs>
      <g stroke="${state.trim}" stroke-width="1">${panels}</g>
      ${textureOverlay()}
      <g fill="${state.text}" text-anchor="middle"
        font-family="Arial,sans-serif" font-style="italic" font-weight="900">
        ${rider}
      </g>
      <g data-part="ribsColour" fill="${state.ribsColour}">${ribs}</g>
      ${logoMarkup()}
    </svg>`;
  }

  function drawParts() {
    $("parts").innerHTML = parts.map(([key, name]) =>
      `<button type="button" class="part ${selected === key ? "active" : ""}"
        data-select="${key}" aria-pressed="${selected === key}">
        <i style="background:${state[key]}"></i>${name}
      </button>`
    ).join("");

    $("parts").querySelectorAll("button").forEach(button => {
      button.onclick = () => {
        selected = button.dataset.select;
        drawParts();
        drawPalette();
      };
    });
  }

  function drawPalette() {
    $("palette").innerHTML = colours.map(([hex, name]) =>
      `<button type="button"
        class="swatch ${state[selected].toLowerCase() === hex ? "selected" : ""}"
        title="${name}" aria-label="${name}"
        aria-pressed="${state[selected].toLowerCase() === hex}"
        style="background:${hex}" data-colour="${hex}"></button>`
    ).join("");

    $("palette").querySelectorAll("button").forEach(button => {
      button.onclick = () => {
        state[selected] = button.dataset.colour;
        render();
      };
    });

    $("colour-name").textContent =
      colours.find(colour => colour[0] === state[selected].toLowerCase())?.[1]
      || "Custom colour";

    $("hex").textContent = state[selected].toUpperCase();
    $("custom").value = state[selected];
  }

  function colourName(hex) {
    const palette = colours.map(([value, label, name]) => [value, name]).concat([
      ["#000000", "Black"],
      ["#0000ff", "Blue"],
      ["#ffff00", "Yellow"],
      ["#ff0000", "Red"],
      ["#008000", "Green"],
      ["#000080", "Dark Blue"],
      ["#808080", "Grey"],
      ["#add8e6", "Light Blue"],
      ["#964b00", "Brown"],
      ["#ffb6c1", "Light Pink"],
      ["#800080", "Purple"]
    ]);

    const rgb = value => [1, 3, 5].map(i => parseInt(value.slice(i, i + 2), 16));
    const input = rgb(hex);
    let nearest = palette[0];
    let best = Infinity;

    for (const entry of palette) {
      const distance = rgb(entry[0]).reduce(
        (sum, value, i) => sum + (value - input[i]) ** 2, 0
      );

      if (distance < best) {
        best = distance;
        nearest = entry;
      }
    }

    return nearest[1];
  }

  function emailContent() {
    const subject = `Design Proof and Price — MX seat cover — ${
      [state.first, state.last].filter(Boolean).join(" ")
    }${state.number ? " #" + state.number : ""}`;

    const texture = state.texture
      ? [
          state.textureTop ? "Top cloth" : "",
          state.textureSides ? "Both sides" : ""
        ].filter(Boolean).join(", ") || "None"
      : "None";

    const body = [
      "Hi Danger UK,",
      "",
      "Please provide a design proof and price for my custom seat cover design.",
      "",
      `Rider: ${state.first} ${state.last}`.trim(),
      `Race number: ${state.number}`,
      `Bike: ${[state.make, state.model, state.year].filter(Boolean).join(" ") || "Not specified"}`,
      `Left side: ${colourName(state.left)}`,
      `Right side: ${colourName(state.right)}`,
      `Top panel: ${colourName(state.top)}`,
      `Ribs: ${state.ribs}, colour ${colourName(state.ribsColour)}`,
      `Gripper texture: ${texture}`,
      "",
      `Notes: ${state.notes || "None"}`
    ].join("\n");

    return { subject, body };
  }

  function updateEmailLink() {
    const { subject, body } = emailContent();
    const attachmentReminder =
      "\n\n[Please attach the JPEG downloaded from the studio before sending.]";

    const href = "mailto:dangeruk22@outlook.com?subject="
      + encodeURIComponent(subject)
      + "&body=" + encodeURIComponent(body + attachmentReminder);

    $("email-design").href = href;
    $("email-draft").href = href;
  }

  function render() {
    $("texture-options").hidden = !state.texture;
    $("preview").innerHTML = svg();
    $("rib-label").textContent = state.ribs + " RIBS";
    drawParts();
    drawPalette();
    updateEmailLink();
  }

  function toast(message) {
    $("toast").textContent = message;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 3500);
  }

  function tab(id) {
    all("[data-tab]").forEach(button => {
      const active = button.dataset.tab === id;
      button.classList.toggle("active", active);
      button.setAttribute("aria-selected", String(active));
    });

    all(".tab-panel").forEach(panel => {
      panel.hidden = panel.id !== id;
    });
  }

  all("[data-tab]").forEach(button => {
    button.onclick = () => tab(button.dataset.tab);
  });

  $("preview").onclick = event => {
    const panel = event.target.closest("[data-part]");
    if (!panel) return;
    selected = panel.dataset.part;
    tab("colours");
    drawParts();
    drawPalette();
  };

  $("custom").oninput = event => {
    state[selected] = event.target.value;
    render();
  };

  const fields = {
    first: "first",
    last: "last",
    number: "number",
    "text-colour": "text",
    ribs: "ribs",
    texture: "texture",
    "texture-top": "textureTop",
    "texture-sides": "textureSides",
    badge: "badge",
    make: "make",
    model: "model",
    year: "year",
    notes: "notes"
  };

  function sync() {
    for (const [id, key] of Object.entries(fields)) {
      const element = $(id);
      if (element.type === "checkbox") element.checked = state[key];
      else element.value = state[key];
    }
  }

  for (const [id, key] of Object.entries(fields)) {
    $(id).oninput = event => {
      state[key] = event.target.type === "checkbox"
        ? event.target.checked
        : event.target.value;

      if (key === "ribs") {
        state.ribs = Math.max(0, Math.min(5, Number(state.ribs) || 0));
        event.target.value = state.ribs;
      }

      if (key === "number") {
        state.number = state.number.replace(/\D/g, "").slice(0, 3);
        event.target.value = state.number;
      }

      render();
    };
  }

  $("save").onclick = () => {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
      toast("Design saved in this browser.");
    } catch {
      toast("Storage full. Export your design to keep it.");
    }
  };

  $("reset").onclick = () => {
    state = { ...defaults };
    selected = "left";
    sync();
    render();
    toast("Restored the default PERCY / 696 design.");
  };

  $("zoom").onclick = () => {
    root.querySelector(".artboard").classList.toggle("zoomed");
  };

  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    anchor.style.display = "none";
    root.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  async function createJpeg() {
    const markup = svg();
    const url = URL.createObjectURL(
      new Blob([markup], { type: "image/svg+xml;charset=utf-8" })
    );

    let image;

    try {
      image = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Could not render design"));
        img.src = url;
      });
    } finally {
      URL.revokeObjectURL(url);
    }

    const canvas = document.createElement("canvas");
    canvas.width = 2380;
    canvas.height = 4096;

    const context = canvas.getContext("2d");
    if (!context) throw new Error("Canvas unavailable");

    context.fillStyle = "#ffffff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);

    return await new Promise((resolve, reject) => {
      canvas.toBlob(
        blob => blob ? resolve(blob) : reject(new Error("JPEG encoding failed")),
        "image/jpeg",
        .95
      );
    });
  }

  function jpegName() {
    return `DangerUK-MX-cover-${state.number || "custom"}.jpg`;
  }

  $("download").onclick = async () => {
    $("download").disabled = true;

    try {
      download(await createJpeg(), jpegName());
      toast("JPEG downloaded. Attach it when emailing your design.");
    } catch (error) {
      console.error(error);
      toast("JPEG export failed. Please try again.");
    } finally {
      $("download").disabled = false;
    }
  };

  $("email-design").onclick = async event => {
    event.preventDefault();
    emailFile = null;
    $("email-download").disabled = true;
    $("share-jpeg").hidden = true;
    $("share-help").hidden = true;
    $("email-status").textContent = "Preparing your JPEG…";

    updateEmailLink();

    const { subject, body } = emailContent();
    emailDetails = {
      title: subject,
      text: "Send to: dangeruk22@outlook.com\n\n" + body
    };

    $("email-dialog").showModal();

    try {
      emailFile = new File([await createJpeg()], jpegName(), {
        type: "image/jpeg"
      });

      $("email-download").disabled = false;

      let supportsSharing = false;

      try {
        supportsSharing = Boolean(
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [emailFile] })
        );
      } catch {}

      $("share-jpeg").hidden = !supportsSharing;
      $("share-help").hidden = !supportsSharing;

      $("email-status").textContent = supportsSharing
        ? "Your JPEG is ready. Share it through your email app, or download it and use the addressed email draft."
        : "Your JPEG is ready. Download it, open the addressed email draft, and attach the JPEG before sending.";
    } catch (error) {
      console.error(error);
      $("email-status").textContent =
        "Could not prepare your JPEG. Close this window and try again.";
    }
  };

  $("email-download").onclick = () => {
    if (emailFile) download(emailFile, emailFile.name);
  };

  $("share-jpeg").onclick = async () => {
    if (!emailFile) return;

    try {
      await navigator.share({ files: [emailFile], ...emailDetails });
    } catch (error) {
      if (error.name !== "AbortError") {
        $("email-status").textContent =
          "Sharing is unavailable. Download the JPEG, open the addressed email draft, and attach the file.";
      }
    }
  };

  $("email-close").onclick = () => $("email-dialog").close();

  $("brief").onclick = () => {
    const { logo, ...specification } = state;

    download(
      new Blob([
        JSON.stringify({
          project: "DuraGrip Seat Cover",
          ...specification,
          customLogo: Boolean(logo)
        }, null, 2)
      ], { type: "application/json" }),
      "DuraGrip-cover-specification.json"
    );
  };

  $("logo").onchange = event => {
    const file = event.target.files[0];
    if (!file) return;

    if (
      !["image/png", "image/jpeg", "image/webp"].includes(file.type) ||
      file.size > 2 * 1024 * 1024
    ) {
      toast("Choose a PNG, JPG or WebP under 2 MB.");
      event.target.value = "";
      return;
    }

    const reader = new FileReader();

    reader.onload = () => {
      state.logo = reader.result;
      render();
      toast("Logo added to your cover.");
    };

    reader.onerror = () => toast("Could not read that logo. Please try another file.");
    reader.readAsDataURL(file);
  };

  $("remove-logo").onclick = () => {
    state.logo = "";
    $("logo").value = "";
    render();
  };

  sync();
  tab("colours");
  render();
})();
</script>
